version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 4
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
    groups:
      angular:
        patterns:
          ['@angular/*', '@angular-devkit/*', 'angular-eslint', '@jsverse/*', 'zone.js', 'rxjs']
      nestjs:
        patterns: ['@nestjs/*', 'nestjs-*']
      lint-and-format:
        patterns:
          [
            'eslint',
            '@eslint/*',
            'typescript-eslint',
            'prettier',
            'prettier-*',
            'husky',
            'lint-staged',
            '@commitlint/*',
          ]
      testing:
        patterns:
          [
            'vitest',
            '@vitest/*',
            'jsdom',
            'supertest',
            '@playwright/*',
            'lighthouse',
            'chrome-launcher',
          ]
      production:
        dependency-type: production
        update-types: [minor, patch]
      development:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Angular supports a narrow TypeScript range and pins it (ADR 2): move it with Angular.
      - dependency-name: typescript
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      # The types follow the Node.js the code runs on (22 and 24), not the newest release.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/setup
    schedule:
      interval: monthly
    commit-message:
      prefix: 'ci(deps)'
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /apps/api
    schedule:
      interval: monthly
    commit-message:
      prefix: 'build(deps)'
    ignore:
      # Node.js moves by decision (ADR 2): only even-numbered LTS lines, and a new line needs the
      # engines range, .nvmrc and the CI setup to change together.
      - dependency-name: node
        update-types: ['version-update:semver-major']
