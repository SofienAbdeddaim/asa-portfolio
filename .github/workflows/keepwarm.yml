name: keepwarm

# Optional. Render's free web services sleep after 15 minutes without traffic, and the first request
# afterwards waits about a minute. Set the repository variable KEEP_WARM to "true" to ping the API
# every 10 minutes. Note the trade-off in docs/DEPLOYMENT.md before enabling it. Never on a private
# repository: 4,320 runs a month, each billed as a minute, are more than its 2,000 free minutes.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    if: vars.KEEP_WARM == 'true' && vars.API_URL != '' && github.event.repository.private != true
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Ping the API
        env:
          API_URL: ${{ vars.API_URL }}
        run: curl -fsS --retry 2 --max-time 60 "$API_URL/api/health"
