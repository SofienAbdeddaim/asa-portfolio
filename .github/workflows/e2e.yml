name: e2e

# The real stack, end to end: the built site (served with the generated headers and redirects),
# the built API and a throwaway MongoDB, driven by a real browser. See docs/TESTING.md.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  playwright:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mongo:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: 'true'
      MONGODB_URI: mongodb://127.0.0.1:27017/portfolio_e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: Build
        run: |
          pnpm --filter @asa/shared build
          pnpm --filter @asa/api build
          pnpm --filter @asa/web build

      - name: Install the browser
        run: pnpm --filter @asa/e2e exec playwright install --with-deps chromium

      - name: Run the tests
        run: pnpm e2e

      - name: Keep the report when something fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
