name: security

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.claude/**'
      - LICENSE
      - .github/CODEOWNERS
      - .github/pull_request_template.md
  # No paths-ignore on pull requests: the ruleset requires these checks, and a check that does not run
  # (a documentation-only change) is a check that never reports, so the pull request could not be merged.
  pull_request:
  schedule:
    # Weekly, so a new advisory is noticed even when nothing is being merged.
    - cron: '17 5 * * 1'
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Code scanning and dependency review are free for public repositories and need a paid license
  # (GitHub Code Security) on private ones, so they only run where they work. The audits, the image
  # scan and the secret scan below run everywhere.
  codeql:
    name: CodeQL
    if: github.event.repository.private != true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:javascript-typescript

  # Open-source static analysis that works on private repositories too (CodeQL above needs a license
  # there). The image is pinned by digest and the rule packs come from the public Semgrep registry,
  # with telemetry off; any finding fails the job. To accept a false positive, add a
  # `// nosemgrep: <rule-id>` comment with the reason next to it.
  sast:
    name: Static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Semgrep 1.179.0
        run: >
          docker run --rm --volume "$PWD:/src" --workdir /src
          semgrep/semgrep@sha256:93963d9295a366f59e4850127b1550400ee7b388f04fe144e4a1f6325d96e01b
          semgrep scan --metrics=off --error
          --config p/security-audit --config p/typescript --config p/nodejs --config p/owasp-top-ten
          apps packages scripts e2e

  dependencies:
    name: Known vulnerabilities
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # What ships to production: any high or critical advisory fails the build.
      - name: Production dependencies
        run: pnpm audit:prod
      # Development tooling is reported but does not block: it never reaches a visitor.
      - name: Development dependencies (report only)
        run: pnpm audit --audit-level moderate || true

  image:
    name: Container image
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the API image
        run: docker build --file apps/api/Dockerfile --tag asa-portfolio-api:scan .
      # Fixed HIGH and CRITICAL findings fail the job; the image is rebuilt (and its OS packages
      # upgraded) every time, so a fix released upstream clears the finding on the next run.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: asa-portfolio-api:scan
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request' && github.event.repository.private != true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime
          comment-summary-in-pr: on-failure

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # The open-source gitleaks binary, pinned and verified, rather than a third-party action.
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version
      - name: Scan the history
        run: ./gitleaks git --redact --verbose --no-banner .
