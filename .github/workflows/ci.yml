name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup

      # Every commit follows Conventional Commits, and so does the pull request title, which
      # becomes the commit message when the pull request is squash-merged.
      - name: Commit messages
        if: github.event_name == 'pull_request'
        run: >
          pnpm exec commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
      - name: Pull request title
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$TITLE" | pnpm exec commitlint

      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Test (coverage thresholds are enforced)
        run: pnpm test
      - run: pnpm build

      - name: Upload coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: apps/*/coverage
          if-no-files-found: ignore
          retention-days: 7

  docker:
    name: API image builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image
        run: docker build --file apps/api/Dockerfile --tag asa-portfolio-api:ci .
      - name: The image starts and fails closed without configuration
        run: |
          set +e
          output="$(docker run --rm asa-portfolio-api:ci 2>&1)"
          status=$?
          echo "$output"
          test "$status" -ne 0
          echo "$output" | grep -q "Invalid environment"
