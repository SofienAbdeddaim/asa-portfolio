packages:
  - apps/*
  - packages/*
  - e2e

# Only these dependencies may run install scripts (native binaries).
allowBuilds:
  argon2: true
  esbuild: true
  '@parcel/watcher': true
  lmdb: true
  msgpackr-extract: true
  '@scarf/scarf': false

minimumReleaseAgeExclude:
  - '@angular-devkit/architect@0.2202.2'
  - '@angular-devkit/core@22.2.2'
  - '@angular-devkit/schematics@22.2.2'
  - '@angular/build@22.2.2'
  - '@angular/cli@22.2.2'
  - '@angular/ssr@22.2.2'
  - '@schematics/angular@22.2.2'

# Security floors for transitive dependencies, until their parents require these versions:
# body-parser and multer (via @nestjs/platform-express; GHSA-27r3-jxmh-p828, GHSA-q7qp-rjg7-q26m)
# and zod 4 (via @angular/forms; GHSA-mrhx-c7xc-m3w5). Remove each once the parent ships it.
overrides:
  body-parser: ^2.4.0
  multer: ^2.5.0
  'zod@>=4 <4.6.6': ^4.6.7
