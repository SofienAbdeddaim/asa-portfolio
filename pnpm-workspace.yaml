packages:
  - apps/*
  - packages/*
  - e2e

# Only these dependencies may run install scripts (native binaries).
allowBuilds:
  argon2: true
  esbuild: true
  '@parcel/watcher': true
  lmdb: true
  msgpackr-extract: true
  '@scarf/scarf': false

minimumReleaseAgeExclude:
  - '@angular-devkit/architect@0.2202.2'
  - '@angular-devkit/core@22.2.2'
  - '@angular-devkit/schematics@22.2.2'
  - '@angular/build@22.2.2'
  - '@angular/cli@22.2.2'
  - '@angular/ssr@22.2.2'
  - '@schematics/angular@22.2.2'
